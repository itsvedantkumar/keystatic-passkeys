version: 2
updates:
  # A reference implementation is worth little if it pins vulnerable versions of
  # the auth libraries it demonstrates. Grouped so it opens one PR a month
  # instead of a dozen — this repo is not worth a maintenance treadmill.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      all:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
